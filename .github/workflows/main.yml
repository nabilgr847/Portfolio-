name: Nobab AI Empire Runner

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # প্রতিদিন রাত ১২টায় অটোমেটিক রান হবে
  workflow_dispatch:      # আপনি যখন চাইবেন বাটন টিপে রান করতে পারবেন

jobs:
  nobab_ai_job:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # বট যাতে নিজে ফাইল লিখে আবার পুশ করতে পারে

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🛠️ Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Run Nobab AI Engine
        run: python nobab_super_ai.py

      - name: 📤 Auto-Commit Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Nobab-AI-Bot"
          git add .
          git commit -m "🤖 AI Update: New Research & Code Generated" || echo "No changes to commit"
          git push
          
